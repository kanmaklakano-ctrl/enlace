name: Build EncanLive APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Prepare persistent signing keystore (Release APK for Firebase App Check reCAPTCHA on real phones)
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > my-upload-key.jks
            echo "store_password=${RELEASE_STORE_PASSWORD:-android}" >> "$GITHUB_OUTPUT"
            echo "key_password=${RELEASE_KEY_PASSWORD:-android}" >> "$GITHUB_OUTPUT"
            echo "Restored release keystore from RELEASE_KEYSTORE_BASE64 secret."
          else
            if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
              printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > debug.keystore
              echo "Restored persistent debug.keystore from DEBUG_KEYSTORE_BASE64 secret."
            elif [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              echo "Restored persistent debug.keystore from repository."
            elif [ ! -f debug.keystore ]; then
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi

            # Re-alias the exact same Firebase-registered certificate to "upload" for assembleRelease
            # This preserves the SHA-1/SHA-256 fingerprint AND lets Android update in-place without uninstalling!
            rm -f my-upload-key.jks
            keytool -importkeystore \
              -srckeystore debug.keystore \
              -srcstorepass android \
              -srcalias androiddebugkey \
              -srckeypass android \
              -destkeystore my-upload-key.jks \
              -deststorepass android \
              -destalias upload \
              -destkeypass android \
              -noprompt
            echo "store_password=android" >> "$GITHUB_OUTPUT"
            echo "key_password=android" >> "$GITHUB_OUTPUT"
            echo "Prepared my-upload-key.jks with persistent certificate for Release APK."
          fi

      - name: Restore Firebase config (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            if printf '%s' "$GOOGLE_SERVICES_JSON" | grep -q '"project_info"'; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            fi
            echo "Restored app/google-services.json from GitHub Secrets."
          elif [ -f app/google-services.json ]; then
            echo "Using app/google-services.json from repository."
          else
            echo "::warning::app/google-services.json is missing! Add GOOGLE_SERVICES_JSON secret in GitHub repo settings so Firebase AI Logic works in this APK."
          fi

      - name: Read app version metadata
        id: app_ver
        run: |
          V_CODE=$(grep -E '^\s*versionCode\s*=' app/build.gradle.kts | head -n1 | sed -E 's/[^0-9]//g')
          V_NAME=$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          COMMIT_MSG=$(git log -1 --pretty=%s | tr '"' "'" | tr '\n' ' ')
          echo "version_code=${V_CODE:-1}" >> "$GITHUB_OUTPUT"
          echo "version_name=${V_NAME:-1.0}" >> "$GITHUB_OUTPUT"
          echo "commit_msg=${COMMIT_MSG}" >> "$GITHUB_OUTPUT"

      - name: Build Release APK (enables real-device Firebase App Check reCAPTCHA + auto-update repo)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ steps.keystore.outputs.store_password }}
          KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
        run: |
          gradle :app:assembleRelease --no-daemon -PENCAN_GITHUB_REPO="${{ github.repository }}"
          cp app/build/outputs/apk/release/app-release.apk EncanLive.apk

      - name: Generate version.json for in-app update notifications
        run: |
          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat <<EOF > version.json
          {
            "versionCode": ${{ steps.app_ver.outputs.version_code }},
            "versionName": "${{ steps.app_ver.outputs.version_name }}",
            "publishedAt": "${PUBLISHED_AT}",
            "releaseNotes": "${{ steps.app_ver.outputs.commit_msg }}",
            "releasePageUrl": "https://github.com/${{ github.repository }}/releases/tag/latest-apk",
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/latest-apk/EncanLive.apk"
          }
          EOF
          cat version.json

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EncanLive-APK
          path: |
            EncanLive.apk
            version.json

      - name: Publish Direct APK Link & version.json in Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Version ${{ steps.app_ver.outputs.version_name }} (build ${{ steps.app_ver.outputs.version_code }}) — ${{ steps.app_ver.outputs.commit_msg }}"
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release edit latest-apk \
              --title "EncanLive v${{ steps.app_ver.outputs.version_name }} (build ${{ steps.app_ver.outputs.version_code }})" \
              --notes "$NOTES"
            gh release upload latest-apk EncanLive.apk version.json --clobber
          else
            gh release create latest-apk EncanLive.apk version.json \
              --title "EncanLive v${{ steps.app_ver.outputs.version_name }} (build ${{ steps.app_ver.outputs.version_code }})" \
              --notes "$NOTES"
          fi
